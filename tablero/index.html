<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitor Macro · AXIA</title>
<meta name="description" content="Monitor Macro de AXIA: actividad, precios, dólar, empleo, comercio exterior, variables monetarias, mercados e internacional, con gráficos interactivos y series para descargar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 46 46'%3E%3Ccircle cx='23' cy='23' r='20.5' fill='%23fff' stroke='%231a2233' stroke-width='3'/%3E%3Cpath d='M14 27 L23 15 L32 27' fill='none' stroke='%23b8874a' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="i18n_en.js?v=c9165f20"></script>
<script src="datos.js?v=82d0ff49"></script>
<style>
/* Editorial: navegación superior en píldoras, indicadores grandes, gráfico a todo el ancho */
:root{
  --bg:#f7f4ee; --paper:#fffdf9; --ink:#1a2233; --ink-2:#4b5466; --ink-3:#6a7382; --rule:#ddd6c9; --rule-2:#ebe5da;
  --navy:#1a2233; --gold:#b8874a; --soft:#f2ece1; --bar-soft:#a9c9f0;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --pos:#2a78d6; --neg:#e34948;
  --display:"Cormorant Garamond",Georgia,serif; --ui:Manrope,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{position:sticky;top:0;z-index:20;background:rgba(247,244,238,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.top .fila{max-width:1160px;margin:0 auto;height:64px;padding:0 clamp(16px,3vw,32px);display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.logo b{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.2em;color:var(--ink)}
.logo small{display:block;font-size:8px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-3)}
.top .sep{width:1px;height:26px;background:var(--rule)}
.top .nombre{font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);text-decoration:none}
.top .nombre{display:inline-flex;align-items:center;gap:9px}
.top .nombre .vivo{width:7px;height:7px;border-radius:50%;background:#3e7a55;position:relative;flex:none}
.top .nombre .vivo::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #3e7a55;animation:axVivo 1.8s ease-out infinite}
.top .nombre .brillo{background:linear-gradient(100deg,var(--gold) 40%,#f3dcb4 50%,var(--gold) 60%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:axBrillo 6s ease-in-out infinite}
@keyframes axVivo{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
@keyframes axBrillo{0%{background-position:100% 0}35%,100%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.top .nombre .vivo::after,.top .nombre .brillo{animation:none}.top .nombre .brillo{color:var(--gold);background:none}}
.top .esp{flex:1}
.top .act{font-size:12.5px;color:var(--ink-3)}
.idioma{background:none;border:1px solid var(--rule);border-radius:2px;padding:5px 10px;font:inherit;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--ink-2);cursor:pointer}
.idioma:hover{border-color:var(--gold);color:var(--gold)}
.navb{display:flex;flex-wrap:wrap;gap:6px;max-width:1160px;margin:0 auto;padding:0 clamp(16px,3vw,32px) 10px;scrollbar-width:none}
.navb::-webkit-scrollbar{display:none}
.navb a{white-space:nowrap;text-decoration:none;font-size:13.5px;padding:6px 12px;border:1px solid var(--rule);border-radius:999px;color:var(--ink-2)}
.navb a:hover{border-color:var(--gold);color:var(--gold)}
.navb a.on{background:var(--navy);border-color:var(--navy);color:#fff}

main{max-width:1060px;margin:0 auto;padding:clamp(24px,4vw,44px) clamp(16px,3vw,32px) 64px}

/* portada */
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-weight:500;font-size:clamp(34px,4.6vw,54px);line-height:1.05;letter-spacing:-.01em;margin-top:10px;text-wrap:balance}
.bajada{color:var(--ink-2);max-width:62ch;margin-top:12px;font-size:16px}
.bloque{margin-top:clamp(30px,4vw,46px)}
.bloque-tit{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:16px}
.bloque-tit h2{font-family:var(--display);font-weight:500;font-size:27px}
.bloque-tit span{font-size:13px;color:var(--ink-3)}
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,235px),1fr));gap:14px}
.tarjeta{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:18px 18px 16px;text-decoration:none;transition:border-color .15s,transform .15s}
.tarjeta:hover{border-color:var(--gold);transform:translateY(-1px)}
.tarjeta svg{width:24px;height:24px;stroke:var(--gold);fill:none;stroke-width:1.5}
.tarjeta h3{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.15;margin-top:6px}
.tarjeta p{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.tarjeta .dato{margin-top:auto;padding-top:10px;border-top:1px solid var(--rule-2);display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:var(--ink-3)}
.tarjeta .dato b{font-size:17px;font-weight:600;color:var(--ink);white-space:nowrap}
.grilla.secs{grid-template-columns:repeat(4,minmax(0,1fr))}
.mini{margin:6px 0 0}
.tarjeta .mini svg{display:block;width:100%;height:64px;stroke:none}
.mini figcaption{font-size:11px;color:var(--ink-3);margin-top:4px}
.tarjeta.pedido{background:linear-gradient(180deg,#fffdf9,#f8f3ea)}
.chip{position:absolute;top:14px;right:14px;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--soft);color:#8f6531}

/* sección */
.migas{font-size:12.5px;color:var(--ink-3)}
.migas a{text-decoration:none;border-bottom:1px solid var(--rule)}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:14px;margin-top:6px}
.cab h1{font-size:clamp(32px,4vw,46px);margin-top:4px}
.cab .sub{color:var(--ink-2);margin-top:4px}
.pill{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--soft);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--rule)}
.kpi{padding:18px 16px 16px;min-width:0}
.kpi+.kpi{border-left:1px solid var(--rule)}
.kpi .e{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-weight:600;font-size:30px;letter-spacing:-.02em;line-height:1.15;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12.5px;color:var(--ink-3)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;margin-top:22px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:12px 12px 10px;font-size:14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:first-child{padding-left:0}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
.herr{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:16px}
.herr .tit{font-weight:600;font-size:16px;margin-right:auto}
.herr .tit small{display:block;font-weight:400;font-size:12.5px;color:var(--ink-3)}
.rangos{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.rangos button{background:none;border:0;padding:5px 10px;font-size:12.5px;color:var(--ink-2)}
.rangos button+button{border-left:1px solid var(--rule)}
.rangos button.on{background:var(--navy);color:#fff}
.btn{background:none;border:1px solid var(--rule);border-radius:4px;padding:5px 11px;font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--gold);color:var(--gold)}
/* G20 */
.g20ctl{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.g20ctl .fila{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.g20ctl label{font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:8px}
.g20ctl select{font:inherit;font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:5px 8px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--navy);color:#fff}
.tabla-g20{margin-top:14px;overflow-x:auto;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.tabla-g20 table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tabla-g20 th,.tabla-g20 td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule-2)}
.tabla-g20 thead th{position:sticky;top:0;background:var(--bg);font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;vertical-align:bottom;user-select:none}
.tabla-g20 thead th:hover{color:var(--gold)}
.tabla-g20 thead th small{display:block;font-weight:400;color:var(--ink-3);font-size:11px}
.tabla-g20 th:first-child{text-align:left;position:sticky;left:0;background:inherit;z-index:1}
.tabla-g20 tbody th{font-weight:500;background:var(--paper)}
.tabla-g20 td.neg{color:var(--neg)}
.tabla-g20 tr.arg th,.tabla-g20 tr.arg td{background:#f6ecdc;font-weight:600}
/* columna fija (país / componente): fondo opaco para que no se vea lo que pasa por debajo al desplazar */
.tabla-g20 tbody th:first-child{background:var(--paper)}
.tabla-g20 thead th:first-child{background:var(--bg);z-index:2}
.tabla-g20 tbody tr.arg th:first-child{background:#f6ecdc}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.cats{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cat{font-size:10px;font-weight:600;font-style:normal;letter-spacing:.02em;padding:1px 7px;border-radius:999px;color:#fff;border:1px solid transparent;line-height:1.5}
.cat.nuc{background:#1a2233}.cat.reg{background:#b8874a}.cat.est{background:#3d6fa8}
.cat.sec{background:transparent}.cat.nuc.sec{color:#1a2233;border-color:#1a2233}.cat.reg.sec{color:#8f6531;border-color:#b8874a}.cat.est.sec{color:#3d6fa8;border-color:#3d6fa8}
.pills button{font-size:12.5px;padding:5px 12px;border:1px solid var(--rule);border-radius:999px;background:var(--paper);color:var(--ink-2)}
.pills button:hover{border-color:var(--gold);color:var(--gold)}
.pills button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tabla-g20 table.calor{width:100%;font-size:12.5px}
.tabla-g20 table.calor td{text-align:center;padding:7px 8px;min-width:78px;border-bottom:1px solid rgba(255,255,255,.6);border-right:1px solid rgba(255,255,255,.6)}
.tabla-g20 table.calor thead th{text-align:center;font-weight:600;font-size:12px;padding:7px 6px;white-space:normal}
.tabla-g20 table.calor thead th:first-child,.tabla-g20 table.calor tbody th{text-align:left;min-width:170px}
.tabla-g20 table.calor tr.gen td{color:var(--ink-3);font-style:italic;background:var(--bg)}
.tabla-g20 .per{display:block;font-size:10.5px;font-weight:400;color:var(--ink-3);margin-top:1px}
.tabla-g20 .per.anual{font-style:italic;opacity:.8}
.tabla-g20 tr.agr th,.tabla-g20 tr.agr td{color:var(--ink-3);font-style:italic}
.lienzo{position:relative;height:400px;padding-top:10px}
.fuente{font-size:12px;color:var(--ink-3);margin-top:6px}
.nota{background:var(--soft);border-left:3px solid var(--gold);padding:12px 16px;margin-top:20px;font-size:14px;color:var(--ink-2);border-radius:2px}

/* a pedido */
.pedido-box{background:var(--navy);color:#fff;border-radius:4px;padding:clamp(24px,4vw,40px);margin-top:24px}
.pedido-box h2{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.15}
.pedido-box p{color:rgba(255,255,255,.82);margin-top:10px;max-width:60ch}
.pedido-box ul{margin:16px 0 0 18px;color:rgba(255,255,255,.88)}
.pedido-box li{margin-top:4px}
.contacto{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.contacto a{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:2px;text-decoration:none;font-size:14px;font-weight:600}
.contacto .c1{background:var(--gold);color:#fff}
.contacto .c2{border:1px solid rgba(255,255,255,.4);color:#fff}
.contacto a:hover{filter:brightness(1.08)}

.pie{max-width:1060px;margin:0 auto;padding:22px clamp(16px,3vw,32px) 40px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
.pie a{color:var(--ink-2)}

@media (max-width:1000px){ .grilla.secs{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .grilla.secs{grid-template-columns:1fr} }
@media (max-width:760px){
  /* en celular las pastillas no entran en dos líneas: vuelven a desplazarse */
  .navb{flex-wrap:nowrap;overflow-x:auto}
  .g20ctl label{width:100%}
  .tabla-g20 table.calor thead th:first-child,.tabla-g20 table.calor tbody th{min-width:118px;max-width:118px;white-space:normal;line-height:1.25}
  .g20ctl select{flex:1;min-width:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--rule)}
  .kpi .v{font-size:clamp(17px,5.4vw,22px)}
  .top .sep,.top .nombre,.top .act{display:none}
  .lienzo{height:300px}
}
</style>
</head>
<body>
<header class="top">
  <div class="fila">
    <a class="logo" href="/" aria-label="AXIA, ir al sitio">
      <svg width="32" height="32" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="21" fill="none" stroke="#1a2233" stroke-width="1.15"/><path d="M14 27 L23 15 L32 27" fill="none" stroke="#b8874a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span><b>AXIA</b><small>Consultora Económica</small></span>
    </a>
    <span class="sep" aria-hidden="true"></span><a class="nombre" href="#inicio"><span class="vivo" aria-hidden="true"></span><span class="brillo">Monitor Macro</span></a>
    <span class="esp"></span><span class="act" id="act"></span><button type="button" class="idioma" id="idioma" aria-label="Español / English">EN</button>
  </div>
  <nav class="navb" id="navb" aria-label="Secciones del tablero"></nav>
</header>

<main id="vista"></main>
<footer class="pie"><span>AXIA · Consultora Económica · <a href="https://axiaeconomia.ar">axiaeconomia.ar</a></span><span>Datos públicos oficiales y de mercado; pueden ser revisados por los organismos productores.</span></footer>

<script>
const D = window.DATOS, S = D.secciones;
// ---------- idioma: ?lang=en, o lo elegido en axiaeconomia.ar (misma clave "axia-lang"), o español
const LANG = (()=>{ const q = new URLSearchParams(location.search).get("lang");
  if (q === "en" || q === "es") { try { localStorage.setItem("axia-lang", q); } catch(e){} return q; }
  try { return localStorage.getItem("axia-lang") === "en" ? "en" : "es"; } catch(e){ return "es"; } })();
const EN_ = LANG === "en";
document.documentElement.lang = LANG;
const MES = EN_ ? ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"] : ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL = EN_ ? ["January","February","March","April","May","June","July","August","September","October","November","December"]
                 : ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const ROM = ["I","II","III","IV"];
const CSSV = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fnum = (v, dec=1) => (v < 0 ? "−" : "") + Math.abs(v).toLocaleString(EN_ ? "en-US" : "es-AR", {minimumFractionDigits:dec, maximumFractionDigits:dec});
const fsig = (v, dec=1) => (v > 0 ? "+" : "") + fnum(v, dec);
const PESO = () => EN_ ? "AR$ " : "$ ";
const fecha = s => { const [a,m,d] = s.split("-"); return EN_ ? `${MESL[+m-1]} ${+d}, ${a}` : `${+d} de ${MESL[+m-1]} de ${a}`; };
const mesAnio = s => { const [a,m] = s.split("-"); return `${MESL[+m-1]} ${a}`; };
const corto = s => { const [a,m] = s.split("-"); return `${MES[+m-1]}-${a.slice(2)}`; };
const trim = s => { const [a,m] = s.split("-"); const q = Math.floor((+m-1)/3); return EN_ ? `Q${q+1}-${a.slice(2)}` : `${ROM[q]}-${a.slice(2)}`; };
const trimLargo = s => { const [a,m] = s.split("-"); const q = Math.floor((+m-1)/3);
  return EN_ ? `Q${q+1} ${a}` : `${["primer","segundo","tercer","cuarto"][q]} trimestre ${a}`; };
const sem = s => { const [a,m] = s.split("-"); return `${EN_ ? (+m<7?"H1":"H2") : (+m<7?"1S":"2S")}-${a.slice(2)}`; };
const semLargo = s => { const [a,m] = s.split("-"); return EN_ ? `${+m<7?"first":"second"} half ${a}` : `${+m<7?"primer":"segundo"} semestre ${a}`; };

// Traducción: una sola pasada sobre el texto ya armado (frases más largas primero, palabras completas).
const DIC = EN_ ? {...(window.EN||{}), "mil":"k", "pb":"bp", "ene":"Jan", "abr":"Apr", "ago":"Aug", "dic":"Dec",
  "feb":"Feb", "mar":"Mar", "may":"May", "jun":"Jun", "jul":"Jul", "sep":"Sep", "oct":"Oct", "nov":"Nov",
  "T1":"Q1", "T2":"Q2", "T3":"Q3", "T4":"Q4"} : {};
const RX = EN_ ? new RegExp("(?<![\\p{L}\\p{N}])(" + Object.keys(DIC).sort((a,b)=>b.length-a.length)
  .map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") + ")(?![\\p{L}\\p{N}])", "gu") : null;
const T = s => (!EN_ || typeof s !== "string") ? s : (DIC[s] ?? s.replace(RX, m=>DIC[m]));
function traducir(raiz){
  if (!EN_ || !raiz) return;
  const w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT);
  for (let n; (n = w.nextNode());) if (/\p{L}/u.test(n.nodeValue)) n.nodeValue = T(n.nodeValue);
  raiz.querySelectorAll("[title],[aria-label]").forEach(e=>{
    for (const a of ["title","aria-label"]) if (e.hasAttribute(a)) e.setAttribute(a, T(e.getAttribute(a))); });
}
// Gráficos: nombres de series, categorías y textos de los tooltips pasan por T.
if (EN_ && window.Chart){
  const Base = window.Chart;
  window.Chart = class extends Base { constructor(ctx, cfg){
    const d = cfg.data || {};
    if (Array.isArray(d.labels)) d.labels = d.labels.map(T);
    (d.datasets||[]).forEach(ds=>{ ds.label = T(ds.label); });
    const cb = cfg.options?.plugins?.tooltip?.callbacks;
    if (cb) for (const k of ["title","label"]) if (cb[k]) { const f = cb[k]; cb[k] = (...a)=>{ const r = f(...a); return Array.isArray(r) ? r.map(T) : T(r); }; }
    super(ctx, cfg); } };

// Gráfico chico de cada tarjeta: SVG inline, sin Chart.js.
function mini(m){
  const s = m.d(); if (!s) return "";
  const pts = s.x.map((x,i)=>[x,s.y[i]]).filter(p=>p[1]!=null).slice(-m.desde);
  if (pts.length < 2) return "";
  const W = 240, H = 64, ys = pts.map(p=>p[1]);
  const lo = Math.min(...ys, m.tipo==="bar" ? 0 : Infinity), hi = Math.max(...ys, m.tipo==="bar" ? 0 : -Infinity);
  const Y = v => H - 3 - (v - lo) / ((hi - lo) || 1) * (H - 6);
  let cuerpo;
  if (m.tipo === "bar") {
    const w = W / pts.length, y0 = Y(0);
    cuerpo = pts.map(([,v],i)=>{ const y = Y(v); return `<rect x="${(i*w+w*.15).toFixed(1)}" y="${Math.min(y,y0).toFixed(1)}" width="${(w*.7).toFixed(1)}" height="${Math.max(Math.abs(y0-y),1).toFixed(1)}" fill="${m.signo&&v<0?"var(--neg)":"var(--navy)"}" opacity="${i===pts.length-1?1:.55}"/>`; }).join("");
  } else {
    const X = i => i / (pts.length - 1) * W;
    const d = pts.map(([,v],i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join("");
    cuerpo = `<path d="${d}L${W} ${H}L0 ${H}Z" fill="var(--gold)" opacity=".10"/><path d="${d}" fill="none" stroke="var(--navy)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
  }
  return `<figure class="mini" aria-label="${m.et}"><svg viewBox="-3 0 ${W+6} ${H}" preserveAspectRatio="none">${cuerpo}</svg><figcaption>${m.et}</figcaption></figure>`;
}

function etiquetador(xs){
  if (xs.length < 3) return {cor:corto, lar:mesAnio};
  const paso = (new Date(xs[xs.length-1]) - new Date(xs[0])) / 864e5 / (xs.length-1);
  if (paso < 20) return {cor:corto, lar:fecha};
  if (paso < 40) return {cor:corto, lar:mesAnio};
  if (paso < 120) return {cor:trim, lar:trimLargo};
  return {cor:sem, lar:semLargo};
}
const fval = (tab, v) => v==null ? T("s.d.") : (tab.u==="$"?PESO():tab.u.startsWith("US$")?"US$ ":"") + fnum(v, tab.dec) +

  const ia = s => ({x:xs, y:xs.map((_,i)=>s[i+12]==null || s[i]==null ? null : (s[i+12]/s[i]-1)*100)});
  return {"Nivel general":ia(R.general), ...Object.fromEntries(["Núcleo","Regulados","Estacionales"].filter(c=>R.comp[c]).map(c=>[c, ia(R.comp[c])]))};

    estado.visible = {cats:nombres, series:{[tab.t]:vals}};
    return;

  let xs = ref.x;
  for (const n of nombres.slice(1)) xs = [...new Set([...xs, ...datos[n].x])];
  xs.sort();
  const i0 = Math.max(0, xs.findIndex(f=>new Date(f)>=desde));
  const etiquetas = xs.slice(i0), E = etiquetador(ref.x);
  const sets = nombres.map((n,j)=>{

      scales:{...base.scales, x:{...base.scales.x, ticks:{...base.scales.x.ticks, callback:v=>E.cor(etiquetas[v])}}}}});
  estado.visible = {cats:etiquetas, series:Object.fromEntries(sets.map(s=>[s.label, s.data]))};

  ctl.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{g.vista=b.dataset.v; dibujar();});
  ctl.querySelectorAll(".pills").forEach(p=>p.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const id = p.dataset.id, k = b.dataset.k;
    g[id] = k;
    dibujar(); }));
  document.getElementById("g-fuente").textContent = "INDEC";

  const tit = document.getElementById("g-tit"), lienzo = document.querySelector(".lienzo"), ctx = document.getElementById("g");
  const ink3 = CSSV("--ink-3"), grid = CSSV("--rule-2"), tick = {color:ink3, font:{family:"Manrope",size:11}};
  const tip = {backgroundColor:"#1a2233", titleFont:{family:"Manrope",weight:"600"}, bodyFont:{family:"Manrope"}, padding:10, boxPadding:4};
  const vr = (s, i, j) => s[i]==null || s[j]==null ? null : (s[i]/s[j] - 1) * 100;
  const rel = (v, gen) => ((1+v/100)/(1+gen/100) - 1)*100;   // cambio % del precio relativo

  if (g.vista === "mes"){
    // brecha del último dato: p.p. para mensual/interanual/año; para "desde" se mide el cambio del precio relativo
    const j = desde(g.medida);
    const relativo = g.medida.includes("-");
    const gen = vr(R.general, n, j);
    const filas = nombres(g.grupo).map(c=>{ const v = vr(R.comp[c], n, j);
      return {c, v, b: relativo ? ((1+v/100)/(1+gen/100) - 1)*100 : v - gen}; }).sort((a,b)=>b.b-a.b);
    const etiq = {mes:"variación mensual", ia:"variación interanual", anio:"acumulada en el año"}[g.medida] || "desde " + BASES[g.medida];
    tit.innerHTML = `Brecha con el nivel general · ${etiq}<small>${relativo ? "Cambio % del precio relativo (componente / nivel general)" : "Puntos porcentuales: inflación del componente menos la del nivel general"} · ${lugar} · ${mesAnio(ult)} · nivel general: ${fnum(gen,1)}%${filas.some(f=>CAT_CLS[f.c]) ? " · en pastilla, las categorías" : ""}</small>`;
    lienzo.style.height = Math.max(300, 28*filas.length + 60) + "px";
    grafico = new Chart(ctx, {type:"bar", data:{labels:filas.map(f=>f.c), datasets:[{label:"Brecha", data:filas.map(f=>f.b), borderRadius:3, maxBarThickness:20,
      backgroundColor:filas.map(f=>f.b>=0?"#a8524b":"#3d6fa8")}]},
      options:{responsive:true, maintainAspectRatio:false, animation:{duration:250}, indexAxis:"y",
        plugins:{legend:{display:false}, tooltip:{...tip, callbacks:{label:c=>{ const f = filas[c.dataIndex];
          return [` Brecha: ${fsig(f.b,1)}${relativo?"%":" p.p."}`, ` ${f.c}: ${fnum(f.v,1)}%`, ` Nivel general: ${fnum(gen,1)}%`]; }}}},
        scales:{x:{grid:{color:grid}, border:{display:false}, ticks:{...tick, callback:v=>fsig(v, Math.abs(v)>=10?0:1)}},
                // las categorías se dibujan como pastilla (plugin de abajo): su texto normal queda transparente
                y:{grid:{display:false}, ticks:{color:c=>CAT_CLS[filas[c.index]?.c] ? "transparent" : CSSV("--ink-2"), font:{family:"Manrope",size:11.5}, autoSkip:false, padding:12}}}},
      plugins:[{id:"pastillasCategoria", afterDraw(ch){
        const y = ch.scales.y, cx = ch.ctx, colPill = {"Núcleo":"#1a2233", "Regulados":"#b8874a", "Estacionales":"#3d6fa8"};
        cx.save(); cx.font = "600 11px Manrope"; cx.textBaseline = "middle"; cx.textAlign = "right";
        filas.forEach((f,i)=>{ if (!colPill[f.c]) return;
          const yy = y.getPixelForTick(i), der = y.right - 8, w = cx.measureText(T(f.c)).width + 14, h = 18;
          cx.fillStyle = colPill[f.c]; cx.beginPath(); cx.roundRect(der - w, yy - h/2, w, h, 9); cx.fill();
          cx.fillStyle = "#fff"; cx.fillText(T(f.c), der - 7, yy + 0.5); });
        cx.restore(); }}]});
    estado.visible = {h:"Componente", cats:filas.map(f=>f.c), series:{"Variación del componente (%)":filas.map(f=>f.v),
      "Variación del nivel general (%)":filas.map(()=>gen), [relativo?"Cambio del precio relativo (%)":"Brecha (p.p.)"]:filas.map(f=>f.b)}};
    return;
  }

  if (g.vista === "rel"){
    // precio relativo = índice del componente / índice general, base 100 en el mes elegido
    const b = at(g.base), xs = B.x.slice(b), cs = nombres("Categorías");   // solo núcleo, regulados y estacionales
    tit.innerHTML = `Precios relativos: componente / nivel general<small>${lugar} · base ${BASES[g.base]} = 100 · por encima de 100, el componente se encareció más que el promedio · tocá la leyenda para ocultar series</small>`;
    lienzo.style.height = "";
    const sets = cs.map((c,k)=>({label:c, data:xs.map((_,i)=>R.comp[c][b+i]==null || R.comp[c][b]==null ? null : R.comp[c][b+i]/R.comp[c][b] / (R.general[b+i]/R.general[b]) * 100), spanGaps:true,
      borderColor:B_COL[k%B_COL.length], backgroundColor:B_COL[k%B_COL.length], borderWidth:2, pointRadius:0, pointHoverRadius:4, tension:0}));
    sets.push({label:"Nivel general", data:xs.map(()=>100), borderColor:"#9aa0a8", borderDash:[5,4], borderWidth:1.5, pointRadius:0, pointHoverRadius:0});
    grafico = new Chart(ctx, {type:"line", data:{labels:xs, datasets:sets},
      options:{responsive:true, maintainAspectRatio:false, animation:{duration:250}, interaction:{mode:"index", intersect:false},
        plugins:{legend:{position:"top", align:"start", labels:{font:{family:"Manrope",size:12}, color:CSSV("--ink-2"), boxWidth:12, boxHeight:12, usePointStyle:true, pointStyle:"rectRounded"}},
          tooltip:{...tip, itemSort:(a,b)=>b.parsed.y-a.parsed.y, filter:it=>it.dataset.label!=="Nivel general",
            callbacks:{title:it=>mesAnio(xs[it[0].dataIndex]), label:c=>` ${c.dataset.label}: ${fnum(c.parsed.y,1)}`}}},
        scales:{x:{grid:{display:false}, ticks:{...tick, maxRotation:0, autoSkipPadding:18, callback:v=>mesC(xs[v])}},
                y:{grid:{color:grid}, border:{display:false}, ticks:{...tick, callback:v=>fnum(v,0)}}}}});
    estado.visible = {h:"Mes", cats:xs, series:Object.fromEntries(sets.slice(0,-1).map(s=>[s.label, s.data]))};
    return;
  }

  // mapa de calor: variación punta a punta de cada período; el color mide la brecha con el nivel general
  lienzo.hidden = true;
  const t = document.getElementById("tabla"); t.hidden = false;
  const cs = nombres(g.grupo);
  const cols = PER.map(([m,et])=>{ const j = desde(m), gen = vr(R.general, n, j);
    const vals = cs.map(c=>{ const v = vr(R.comp[c], n, j); return {v, b:rel(v, gen)}; });
    const tope = Math.max(...vals.map(x=>Math.abs(x.b)), 0.1);   // cada columna satura en su brecha máxima
    return {et, gen, vals, tope, sub:`${m==="anio" ? "dic-"+B.x[j].slice(2,4) : mesC(B.x[j])} a ${mesC(ult)}`}; });
  const celda = (b, tope) => { const a = Math.min(Math.abs(b)/tope, 1)*.8, col = b>=0 ? `rgba(168,82,75,${a})` : `rgba(61,111,168,${a})`;
    return `background:${col};color:${a>.5?"#fff":"inherit"}`; };
  const fv = v => { const d = Math.abs(v)>=1000 ? 0 : 1, r = Math.round(v*10**d)/10**d || 0; return fnum(r, d); };   // sin "-0,0"
  tit.innerHTML = `Mapa de calor: variación punta a punta por período<small>${lugar} · % de variación de cada componente · rojo: subió más que el nivel general; azul: menos · la intensidad se compara dentro de cada columna · pastillas: categoría predominante de cada división (en contorno, la de menor peso)</small>`;
  t.innerHTML = `<table class="calor"><thead><tr><th>Componente</th>${cols.map(c=>`<th>${c.et}<small>${c.sub}</small></th>`).join("")}</tr></thead><tbody>
    <tr class="gen"><th>Nivel general</th>${cols.map(c=>`<td>${fv(c.gen)}</td>`).join("")}</tr>
    ${cs.map((c,i)=>`<tr><th>${c}${CAT_DIV[c] ? `<span class="cats">${CAT_DIV[c].map(catPill).join("")}</span>` : CAT_CLS[c] ? `<span class="cats">${catPill(c,0)}</span>` : ""}</th>${cols.map(col=>{ const x = col.vals[i];
      return `<td style="${celda(x.b, col.tope)}" title="${c} · ${col.et}: ${fv(x.v)}% (nivel general ${fv(col.gen)}%) · precio relativo ${fsig(x.b,1)}%">${fv(x.v)}</td>`; }).join("")}</tr>`).join("")}</tbody></table>`;
  estado.visible = {h:"Componente", cats:["Nivel general", ...cs],
    series:Object.fromEntries(cols.flatMap(c=>[[`${c.et} ${c.sub} (%)`, [c.gen, ...c.vals.map(x=>x.v)]], [`${c.et}: cambio del precio relativo (%)`, [0, ...c.vals.map(x=>x.b)]]]))};
}

// ---------- G20: último dato publicado de cada variable, con su período ----------
const G_CORTO = {crec:"Crecimiento PIB",infl:"Inflación",desemp:"Desempleo",fiscal:"Resultado fiscal",deuda:"Deuda pública",cc:"Cuenta corriente",pibpc:"PIB per cápita",pibppa:"PIB p/c PPA",pib:"PIB"};
const G_UNI = {crec:"% interanual, trimestre", infl:"% interanual, mes", desemp:"%, mes o trimestre", fiscal:"% PIB, año", deuda:"% PIB, año",
               cc:"% PIB, trimestre", pibpc:"US$, año", pibppa:"US$ PPA, año", pib:"US$ mil M, año"};
function dibujarG20ult(U, G){
  const g = estado.gu = estado.gu || {orden:"crec", dir:-1};
  document.querySelector(".lienzo").hidden = true;
  const t = document.getElementById("tabla"); t.hidden = false;
  document.getElementById("g-tit").innerHTML = `Últimos datos publicados<small>Cada celda muestra el dato más reciente y su período · consultado el ${fecha(U.consulta)} · tocá un encabezado para ordenar</small>`;
  const ks = Object.keys(U.v), ps = Object.keys(G.paises).filter(p=>p!=="WEOWORLD");
  const cel = (k,p) => U.v[k][p];
  const filas = ps.slice();
  if (g.orden==="pais") filas.sort((a,b)=>G.paises[a].localeCompare(G.paises[b])*g.dir);
  else filas.sort((a,b)=>{ const x = cel(g.orden,a), y = cel(g.orden,b); if (!x) return 1; if (!y) return -1; return (x.v-y.v)*g.dir; });
  const flecha = k => g.orden===k ? (g.dir<0?" ↓":" ↑") : "";
  t.innerHTML = `<table class="ult"><thead><tr><th data-o="pais">País${flecha("pais")}</th>${ks.map(k=>`<th data-o="${k}">${G_CORTO[k]}${flecha(k)}<small>${G_UNI[k]}</small></th>`).join("")}</tr></thead>
    <tbody>${filas.map(p=>`<tr class="${p==="ARG"?"arg":p==="EU"?"agr":""}"><th>${G.paises[p]}</th>${ks.map(k=>{ const c = cel(k,p);
      if (!c) return `<td>–</td>`;
      return `<td class="${c.v<0?"neg":""}" title="Fuente: ${c.f}">${fnum(c.v, G.ind[k].dec)}<span class="per${c.f==="FMI"?" anual":""}">${c.p} · ${c.f}</span></td>`; }).join("")}</tr>`).join("")}</tbody></table>`;
  t.querySelectorAll("thead th").forEach(th=>th.onclick=()=>{ const o = th.dataset.o;
    g.dir = g.orden===o ? -g.dir : (o==="pais"?1:-1); g.orden = o; dibujar(); });
  document.getElementById("g-pie").textContent = "Crecimiento y cuenta corriente: OCDE. Inflación: BIS (UE: Eurostat). Desempleo: OCDE y OIT. Argentina: INDEC. " +
    "Fiscal, deuda y PIB son anuales (FMI, último año observado); también se usa el FMI cuando un país no tiene dato de alta frecuencia. ";
  const series = {};
  ks.forEach(k=>{ series[`${G_CORTO[k]} (${G_UNI[k]})`] = filas.map(p=>cel(k,p)?cel(k,p).v:null);
                  series[`${G_CORTO[k]}: período y fuente`] = filas.map(p=>cel(k,p)?`${cel(k,p).p} ${cel(k,p).f}`:null); });
  estado.visible = {h:"País", cats:filas.map(p=>G.paises[p]), series};
}

function csv(){
  const v = estado.visible, nombres = Object.keys(v.series);
  const sep = EN_ ? "," : ";", q = x => { const t = String(T(x)); return /[",;\n]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t; };
  const num = x => EN_ ? String(+x.toFixed(4)) : String(+x.toFixed(4)).replace(".",",");
  const filas = [[v.h || "Período", ...nombres].map(q).join(sep)].concat(v.cats.map((c,i)=>[q(c), ...nombres.map(n=>v.series[n][i]==null?"":typeof v.series[n][i]==="number"?num(v.series[n][i]):q(v.series[n][i]))].join(sep)));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿"+filas.join("\n")], {type:"text/csv;charset=utf-8"}));
  a.download = `axia_${estado.id}_${DEF[estado.id].tabs[estado.tab].n.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-")}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

function ruta(){
  let id = (location.hash||"#inicio").slice(1);
  if (!DEF[id] && !PEDIDO.find(p=>p.id===id)) id = "inicio";
  nav(id);
  const v = document.getElementById("vista");
  if (grafico){ grafico.destroy(); grafico = null; }
  v.innerHTML = id==="inicio" ? portada() : DEF[id] ? seccion(id) : pedido(PEDIDO.find(p=>p.id===id));
  document.title = (id==="inicio" ? T("Monitor Macro") : T((SECCIONES.find(s=>s.id===id)||PEDIDO.find(s=>s.id===id)).t) + " · " + T("Monitor Macro")) + " · AXIA";
  traducir(document.getElementById("navb")); traducir(v);
  window.scrollTo(0,0);
  const activo = document.querySelector(".navb a.on"); if (activo) activo.scrollIntoView({block:"nearest", inline:"center"});
  if (DEF[id]){
    dibujar();
    v.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{estado.tab=+b.dataset.tab; estado.rango=null; regionCat="Nacional"; if (estado.b) estado.b.reg="Nacional"; dibujar();});
    v.querySelectorAll("#rangos button").forEach(b=>b.onclick=()=>{estado.rango=b.dataset.r; dibujar();});
    document.getElementById("csv").onclick = csv;
  }
}
document.getElementById("act").textContent = T("Actualizado al") + " " + fecha(D.actualizado) + (D.hora ? " · " + D.hora + " h" : "");
traducir(document.querySelector("header.top")); traducir(document.querySelector("footer.pie"));
const bIdioma = document.getElementById("idioma");
bIdioma.textContent = EN_ ? "ES" : "EN";
bIdioma.onclick = () => { const u = new URL(location.href); u.searchParams.set("lang", EN_ ? "es" : "en"); location.href = u.toString(); };
window.addEventListener("hashchange", ruta);
// Chart.js mide las etiquetas al dibujar: esperar a Manrope evita ejes recortados.
(document.fonts ? document.fonts.load('11px "Manrope"').catch(()=>{}) : Promise.resolve()).then(ruta);
