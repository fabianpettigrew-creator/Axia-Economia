# Actualización diaria del tablero (axiaeconomia.ar/tablero/).
# El código vive en _automatizacion/ (lo copia tablero/sincronizar_ci.py desde la carpeta del Boletín).
name: Tablero diario

on:
  schedule:
    # GitHub no garantiza el horario (atrasa o saltea corridas, sobre todo en hora en punto): dos intentos.
    # Si la primera ya publicó, la segunda no cambia nada.
    - cron: "17 22 * * *"     # 19:17 de Argentina (UTC-3), después de las publicaciones del INDEC
    - cron: "47 23 * * *"     # 20:47 de Argentina, respaldo
    # Series diarias (dólar, riesgo país, reservas, tasas, Merval, commodities): corridas en días hábiles
    # para tomar el último dato apenas lo publica cada fuente. Si nada cambió, no hay commit.
    - cron: "17 14,16,18,20 * * 1-5"   # 11:17, 13:17, 15:17 y 17:17 de Argentina
    - cron: "17 2 * * 2-6"             # 23:17 de Argentina (lunes a viernes): riesgo país y cierres tardíos
  workflow_dispatch:           # botón "Run workflow" para correrlo a mano
  push:                        # y cada vez que cambia el código de la automatización
    branches: [main]
    paths: ["_automatizacion/**", ".github/workflows/tablero.yml"]

permissions:
  contents: write              # commit y push del tablero
  pages: write                 # pedir la publicación de GitHub Pages

concurrency:
  group: tablero
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: _automatizacion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: _automatizacion/requirements.txt

      - run: pip install -r requirements.txt

      # Vintages de días anteriores y cachés (FMI, INDEC): sirven para rellenar lo que una API no devuelva
      - uses: actions/cache@v4
        with:
          path: |
            _automatizacion/boletin/datos
            _automatizacion/tablero/cache
          key: datos-${{ github.run_id }}
          restore-keys: datos-

      - name: Bajar datos y regenerar el tablero
        env:
          TZ: America/Argentina/Buenos_Aires
        run: python tablero/actualizar_diario.py --sitio .. --sin-git

      - name: Publicar
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "AXIA tablero (automático)"
          git config user.email "info@axiaeconomia.ar"
          # Lo que se va a publicar se guarda aparte. Asi se puede partir siempre de lo ultimo
          # que haya en el repositorio, sin rebases: los archivos del tablero los genera esta
          # corrida entera, de modo que pisarlos es lo correcto.
          copia=$(mktemp -d)
          mkdir -p "$copia/tablero" "$copia/datos_locales"
          cp -r tablero/. "$copia/tablero/"
          cp -r _automatizacion/datos_locales/. "$copia/datos_locales/" 2>/dev/null || true
          hora_de() { python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['actualizado'])" "$1" 2>/dev/null || true; }
          publicado=no
          for intento in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            ya=$(hora_de tablero/estado.json)
            nuestra=$(hora_de "$copia/tablero/estado.json")
            if [[ -n "$ya" && -n "$nuestra" && "$ya" > "$nuestra" ]]; then
              echo "Lo publicado ($ya) es mas nuevo que esta corrida ($nuestra): no se pisa"
              publicado=sin-cambios
              break
            fi
            cp -r "$copia/tablero/." tablero/
            mkdir -p _automatizacion/datos_locales
            cp -r "$copia/datos_locales/." _automatizacion/datos_locales/ 2>/dev/null || true
            git add tablero/ _automatizacion/datos_locales/
            if git diff --cached --quiet; then
              echo "Sin cambios respecto de lo ya publicado"
              publicado=sin-cambios
              break
            fi
            git commit -q -m "Tablero: datos al $(TZ=America/Argentina/Buenos_Aires date +%F) (GitHub Actions)"
            if git push -q origin HEAD:main; then
              publicado=si
              break
            fi
            echo "Otra corrida publico primero (intento $intento): se rehace sobre lo ultimo"
            sleep 5
          done
          if [ "$publicado" = "no" ]; then
            echo "No se pudo publicar despues de 3 intentos"
            exit 1
          fi
          if [ "$publicado" = "si" ]; then
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" > /dev/null || true
            echo "Publicado"
          fi
