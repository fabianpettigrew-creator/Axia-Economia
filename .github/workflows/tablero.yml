# Actualización diaria del tablero (axiaeconomia.ar/tablero/).
# El código vive en _automatizacion/ (lo copia tablero/sincronizar_ci.py desde la carpeta del Boletín).
name: Tablero diario

on:
  schedule:
    # GitHub no garantiza el horario (atrasa o saltea corridas, sobre todo en hora en punto): dos intentos.
    # Si la primera ya publicó, la segunda no cambia nada.
    - cron: "17 22 * * *"     # 19:17 de Argentina (UTC-3), después de las publicaciones del INDEC
    - cron: "47 23 * * *"     # 20:47 de Argentina, respaldo
    # Series diarias (dólar, riesgo país, reservas, tasas, Merval, commodities): corridas en días hábiles
    # para tomar el último dato apenas lo publica cada fuente. Si nada cambió, no hay commit.
    - cron: "17 14,16,18,20 * * 1-5"   # 11:17, 13:17, 15:17 y 17:17 de Argentina
    - cron: "17 2 * * 2-6"             # 23:17 de Argentina (lunes a viernes): riesgo país y cierres tardíos
  workflow_dispatch:           # botón "Run workflow" para correrlo a mano
  push:                        # y cada vez que cambia el código de la automatización
    branches: [main]
    paths: ["_automatizacion/**", ".github/workflows/tablero.yml"]

permissions:
  contents: write              # commit y push del tablero
  pages: write                 # pedir la publicación de GitHub Pages

concurrency:
  group: tablero
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: _automatizacion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: _automatizacion/requirements.txt

      - run: pip install -r requirements.txt

      # Vintages de días anteriores y cachés (FMI, INDEC): sirven para rellenar lo que una API no devuelva
      - uses: actions/cache@v4
        with:
          path: |
            _automatizacion/boletin/datos
            _automatizacion/tablero/cache
          key: datos-${{ github.run_id }}
          restore-keys: datos-

      - name: Bajar datos y regenerar el tablero
        env:
          TZ: America/Argentina/Buenos_Aires
        run: python tablero/actualizar_diario.py --sitio .. --sin-git

      - name: Publicar
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "AXIA tablero (automático)"
          git config user.email "info@axiaeconomia.ar"
          git add tablero/ _automatizacion/datos_locales/
          if git diff --cached --quiet; then
            echo "Sin cambios en el tablero"; exit 0
          fi
          git commit -q -m "Tablero: datos al $(TZ=America/Argentina/Buenos_Aires date +%F) (GitHub Actions)"
          if ! git push -q origin HEAD:main; then
            # otra actualización (la de la computadora) publicó mientras tanto: se deja la publicada
            git fetch -q origin main
            if ! git rebase -q origin/main; then
              git rebase --abort
              echo "Otra actualización publicó al mismo tiempo; se deja la ya publicada"; exit 0
            fi
            git push -q origin HEAD:main || { echo "No se pudo publicar; queda la versión anterior"; exit 0; }
          fi
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" > /dev/null || true
          echo "Publicado"
